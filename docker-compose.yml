# FIREMaster — local development stack.
#
# SECURITY DEFAULTS (see SECURITY.md):
#   * Every published port binds to 127.0.0.1 only. Docker publishes to 0.0.0.0 unless you
#     say otherwise, which on a laptop means the whole coffee-shop / office LAN can reach
#     your Postgres and Redis directly, bypassing the app's login entirely. Override with
#     BIND_HOST=0.0.0.0 ONLY if you understand you are exposing your finances to the network.
#   * Postgres and Redis both require a password. `app.setup` generates random ones into the
#     repo-root .env. The CHANGEME-* fallbacks below exist only so the very first
#     `docker compose run ... app.setup` can resolve this file before that .env exists —
#     they are not meant to survive into a real install.
#   * Images default to LOCALLY BUILT tags, so you run the code in this checkout rather than
#     whatever the upstream project last pushed to its registry. Point FIREMASTER_BACKEND_IMAGE
#     / FIREMASTER_FRONTEND_IMAGE at a pinned registry tag if you'd rather pull.

services:
  postgres:
    image: postgres:16-alpine
    ports:
      # host bind is separate from host port so overriding the port can't silently
      # re-expose the service to the LAN
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432"
    # NO env_file: backend/.env — Postgres only reads POSTGRES_* (set below), and pulling in
    # backend/.env made Compose try to interpolate the `$...` in the bcrypt AUTH_PASSWORD_HASH
    # ("variable not set" warnings on every up). The official image ignores those keys anyway.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-firemaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGEME-run-app-setup}
      POSTGRES_DB: ${POSTGRES_DB:-firemaster}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-firemaster}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379"
    # Redis ships with NO authentication. Celery brokers your task payloads through it, so an
    # unauthenticated Redis is a second way into your data. requirepass closes that.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-CHANGEME-run-app-setup}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CHANGEME-run-app-setup}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: applies Alembic migrations, then exits. backend/celery wait for it to
  # finish (service_completed_successfully) so the schema always exists before they run.
  # Seeing "migrate Exited (0)" in `docker compose ps` is NORMAL.
  migrate:
    # SOLE BUILDER of the shared backend image. By default the tag is LOCAL
    # (firemaster-backend:local), so `docker compose up` builds this checkout's code — a fork
    # running the upstream project's prebuilt image would silently not include its own fixes.
    # Set FIREMASTER_BACKEND_IMAGE to a pinned registry tag (never `:latest`) to pull instead.
    # The other three backend services (backend, celery-worker, celery-beat) carry ONLY `image:`
    # and reuse what this builds — they all run after migrate
    # (depends_on: service_completed_successfully). Giving all four `build:` made Compose's bake
    # builder build the same tag 4× in parallel and race on export ("image already exists").
    # One builder = no race. Context = repo root so the image bakes in scripts/ + config/ for
    # the standalone seed — see backend/Dockerfile + the runbook.
    image: ${FIREMASTER_BACKEND_IMAGE:-firemaster-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend:/app/backend
      - /app/backend/.venv
      - ./scripts:/app/scripts      # for the first-run demo auto-seed
      - ./config:/app/config
    # secrets come from the mounted backend/.env (read by pydantic), NOT env_file — see backend service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-firemaster}:${POSTGRES_PASSWORD:-CHANGEME-run-app-setup}@postgres:5432/${POSTGRES_DB:-firemaster}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-firemaster}:${POSTGRES_PASSWORD:-CHANGEME-run-app-setup}@postgres:5432/${POSTGRES_DB:-firemaster}
      REDIS_URL: "redis://:${REDIS_PASSWORD:-CHANGEME-run-app-setup}@redis:6379/0"
      DEMO_MODE: ${DEMO_MODE:-false}
      # First boot only: auto-seed the demo persona when the DB is empty. SEED_DEMO=false starts blank.
      SEED_DEMO: ${SEED_DEMO:-true}
    depends_on:
      postgres:
        condition: service_healthy
    # migrate, THEN first-run demo seed (seeds an EMPTY db only; `|| true` keeps it non-fatal)
    command: ["sh", "-c", "uv run alembic upgrade head && (uv run python ../scripts/seed_demo.py --if-empty || true)"]

  backend:
    # image only — reuses what `migrate` builds/pulls (see migrate's note on the single-builder rule)
    image: ${FIREMASTER_BACKEND_IMAGE:-firemaster-backend:local}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend:/app/backend
      - /app/backend/.venv          # anon volume: keep the image's Linux venv; don't let a host macOS .venv shadow it
      - ./scripts:/app/scripts      # repo-root scripts, so in-container `python ../scripts/...` works
      - ./config:/app/config        # repo-root config, used by seed scripts
    # NOTE: intentionally NO `env_file: backend/.env`. Docker Compose INTERPOLATES env_file
    # values, which strips the `$...` sequences inside the bcrypt AUTH_PASSWORD_HASH and breaks
    # login. The app reads the MOUNTED backend/.env directly via pydantic (no interpolation),
    # so the hash stays intact; only the DB/Redis URLs are injected below as overrides.
    environment:
      # Inside the container, Postgres/Redis are reached by SERVICE NAME, not localhost.
      # These override the localhost values in backend/.env (compose `environment` beats
      # `env_file`, and pydantic reads OS-env over its .env file), so the native start.sh
      # path — which uses backend/.env as-is — is unaffected.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-firemaster}:${POSTGRES_PASSWORD:-CHANGEME-run-app-setup}@postgres:5432/${POSTGRES_DB:-firemaster}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-firemaster}:${POSTGRES_PASSWORD:-CHANGEME-run-app-setup}@postgres:5432/${POSTGRES_DB:-firemaster}
      REDIS_URL: "redis://:${REDIS_PASSWORD:-CHANGEME-run-app-setup}@redis:6379/0"
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    # image only — reuses what `migrate` builds/pulls (see migrate's note on the single-builder rule)
    image: ${FIREMASTER_BACKEND_IMAGE:-firemaster-backend:local}
    volumes:
      - ./backend:/app/backend
      - /app/backend/.venv          # anon volume: shield the image's Linux venv from the host mount
    # secrets come from the mounted backend/.env (read by pydantic), NOT env_file — see backend service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-firemaster}:${POSTGRES_PASSWORD:-CHANGEME-run-app-setup}@postgres:5432/${POSTGRES_DB:-firemaster}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-firemaster}:${POSTGRES_PASSWORD:-CHANGEME-run-app-setup}@postgres:5432/${POSTGRES_DB:-firemaster}
      REDIS_URL: "redis://:${REDIS_PASSWORD:-CHANGEME-run-app-setup}@redis:6379/0"
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # -I app.tasks.sync_tasks is REQUIRED for task autodiscovery (matches scripts/start.sh)
    command: uv run celery -A app.tasks.celery_app worker --loglevel=info -I app.tasks.sync_tasks

  celery-beat:
    # image only — reuses what `migrate` builds/pulls (see migrate's note on the single-builder rule)
    image: ${FIREMASTER_BACKEND_IMAGE:-firemaster-backend:local}
    volumes:
      - ./backend:/app/backend
      - /app/backend/.venv          # anon volume: shield the image's Linux venv from the host mount
    # secrets come from the mounted backend/.env (read by pydantic), NOT env_file — see backend service
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-firemaster}:${POSTGRES_PASSWORD:-CHANGEME-run-app-setup}@postgres:5432/${POSTGRES_DB:-firemaster}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-firemaster}:${POSTGRES_PASSWORD:-CHANGEME-run-app-setup}@postgres:5432/${POSTGRES_DB:-firemaster}
      REDIS_URL: "redis://:${REDIS_PASSWORD:-CHANGEME-run-app-setup}@redis:6379/0"
      DEMO_MODE: ${DEMO_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: uv run celery -A app.tasks.celery_app beat --loglevel=info

  frontend:
    image: ${FIREMASTER_FRONTEND_IMAGE:-firemaster-frontend:local}
    build:
      context: ./frontend
    ports:
      - "${BIND_HOST:-127.0.0.1}:${FRONTEND_HOST_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules    # anon volume: keep image node_modules; don't let the host's shadow it
    environment:
      # The Vite dev server proxies /api SERVER-SIDE (inside this container), so it must
      # reach the backend by service name, not localhost. See frontend/vite.config.ts.
      VITE_API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  pgdata:
